<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>TokenMeter</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0284c7;
      --accent-soft: rgba(2, 132, 199, 0.12);
      --ok-bg: #ecfdf5;
      --ok-fg: #065f46;
      --warn-bg: #fffbeb;
      --warn-fg: #92400e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f141c;
        --card: #161d27;
        --border: rgba(248, 250, 252, 0.1);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-soft: rgba(56, 189, 248, 0.15);
        --ok-bg: rgba(16, 185, 129, 0.14);
        --ok-fg: #6ee7b7;
        --warn-bg: rgba(245, 158, 11, 0.14);
        --warn-fg: #fcd34d;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 14px; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; }
    .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
    .brand { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .actions { display: flex; gap: 6px; }
    button { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    .banner { padding: 10px 12px; border-radius: 10px; font-size: 12px; line-height: 1.5; margin-bottom: 12px; border: 1px solid var(--border); }
    .banner.ok { background: var(--ok-bg); color: var(--ok-fg); }
    .banner.warn { background: var(--warn-bg); color: var(--warn-fg); }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .kpi-label { font-size: 11px; color: var(--muted); }
    .kpi-val { font-size: 18px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
    .sec-title { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
    .q-item { margin-bottom: 8px; }
    .q-meta { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; gap: 6px; }
    .q-bar { height: 6px; border-radius: 99px; background: var(--border); overflow: hidden; }
    .q-fill { height: 100%; background: var(--accent); border-radius: 99px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
    th { color: var(--muted); font-size: 11px; }
    .toggles { display: flex; flex-wrap: wrap; gap: 10px; }
    .toggles label { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="head">
    <div class="brand">⚡ <span data-k="brand">TokenMeter</span> <span id="ver" style="font-size:11px;color:var(--muted);font-weight:500;"></span></div>
    <div class="actions">
      <button id="lang-btn" type="button">EN</button>
      <button id="refresh-btn" type="button">刷新</button>
    </div>
  </div>
  <div id="diag-banner" class="banner warn"></div>
  <div class="grid">
    <div class="card" style="margin:0"><div class="kpi-label" data-k="latestSpeed"></div><div class="kpi-val" id="k-latest">--</div></div>
    <div class="card" style="margin:0"><div class="kpi-label" data-k="sessionSpeed"></div><div class="kpi-val" id="k-session">--</div></div>
    <div class="card" style="margin:0"><div class="kpi-label" data-k="cacheHit"></div><div class="kpi-val" id="k-cache">--</div></div>
    <div class="card" style="margin:0"><div class="kpi-label" data-k="context"></div><div class="kpi-val" id="k-ctx">--</div></div>
  </div>
  <div class="card">
    <div class="sec-title"><span data-k="sparklineTitle"></span><span id="model-name"></span></div>
    <div id="sparkline"></div>
  </div>
  <div class="card">
    <div class="sec-title"><span data-k="quotaTitle"></span></div>
    <div id="quotas"></div>
  </div>
  <div class="card">
    <div class="sec-title"><span data-k="modelRankTitle"></span><span id="today-sum"></span></div>
    <table><thead><tr><th data-k="colModel"></th><th data-k="colTotal"></th><th data-k="colAvgTps"></th><th data-k="colReq"></th></tr></thead><tbody id="rank-body"></tbody></table>
  </div>
  <div class="card">
    <div class="sec-title"><span data-k="customizeTitle"></span></div>
    <div class="toggles" id="toggles"></div>
  </div>
  <script src="./i18n.js"></script>
  <script src="./panel.js"></script>
</body>
</html>
